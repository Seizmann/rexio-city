services:
  backend:
    build:
      context: ../backend/go
      dockerfile: Dockerfile
    ports:
      - "10888:10888"
    environment:
      - PORT=10888
      - DATABASE_URL=postgresql://rexio:rexio@postgres:5432/rexiocity
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-jwt-secret-change-me-for-local
      - JWT_EXPIRY=15m
      - REFRESH_SECRET=dev-refresh-secret-change-me
      - REFRESH_EXPIRY=720h
      - FRONTEND_URL=http://localhost:3000
      - ADMIN_URL=http://localhost:5189
      - BACKEND_URL=http://localhost:10888
      - MEDIA_ENDPOINT=https://cdn-city.rexio.pro
      - MEDIA_BUCKET=rexio-city
      - MEDIA_ACCESS_KEY=test
      - MEDIA_SECRET_KEY=test
      - MEDIA_URL=https://cdn-city.rexio.pro
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=rexio
      - POSTGRES_PASSWORD=rexio
      - POSTGRES_DB=rexiocity
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
