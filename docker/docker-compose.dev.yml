services:
  backend:
    build:
      context: ../backend/go
      dockerfile: Dockerfile
    ports:
      - "10888:10888"
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=rexio
      - POSTGRES_PASSWORD=rexio
      - POSTGRES_DB=rexiocity
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
