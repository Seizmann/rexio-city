# Docker Compose for Local Development

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rexio
      POSTGRES_PASSWORD: rexio_dev
      POSTGRES_DB: rexiocity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/go/migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # R2 is Cloudflare — use minio for local testing
  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: rexio_dev
      MINIO_ROOT_PASSWORD: rexio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
